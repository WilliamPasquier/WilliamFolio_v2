<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <meta name="description" content="William Pasquier portfolio website.">
        <meta name="author" content="William Pasquier">
        <title>William Pasquier - Personal portfolio</title>

        <!-- Import JavaScript files / libraries -->
        <script type="text/javascript" src="js/script.js"></script>
        <script type="text/javascript" src="js/utils.js"></script>
        <script type="text/javascript" src="js/components/finder.js"></script>
        <script type="text/javascript" src="js/components/navbar.js"></script>

        <!-- Import CSS files -->
        <link rel="stylesheet" type="text/css" href="css/styles.css"/>
        <link rel="stylesheet" type="text/css" href="css/variables.css"/>
        <link rel="stylesheet" type="text/css" href="css/iconography.css"/>
        <link rel="stylesheet" type="text/css" href="css/fonts.css"/>
        <link rel="stylesheet" type="text/css" href="css/hero.css"/>
        <link rel="stylesheet" type="text/css" href="css/components/finder.css"/>
        <link rel="stylesheet" type="text/css" href="css/components/hero-skeleton.css"/>
        <link rel="stylesheet" type="text/css" href="css/components/navigation.css"/>
    </head>
    <body>
        <main>
            <!-- Navigation bar - tablet -->
            <header id="navigation-tablet" class="navigation navigation--tablet shadow">
                <nav class="navigation__content navigation__content--tablet">
                    <a href="#" class="navigation__hero--tablet navigation__link--tablet wf-icon-william_logo"></a>
                    <ul class="navigation__sections navigation__sections--tablet">
                        <li class="navigation__section navigation__section--tablet">
                            <a href="#about-me" class="navigation__link--tablet">About me</a>
                        </li>
                        <li class="navigation__section navigation__section--tablet">
                            <a href="#projects" class="navigation__link--tablet">My projects</a>
                        </li>
                        <li class="navigation__section navigation__section--tablet">
                            <a href="#experiences" class="navigation__link--tablet">Experiences</a>
                        </li>
                        <li class="navigation__section navigation__section--tablet">
                            <a href="#contact" class="navigation__link--tablet">Contact me</a>
                        </li>
                    </ul>
                    <button id="language-toggle-tablet" class="navigation__language--tablet navigation__language-open wf-icon-globe"></button>
                </nav>
                <div class="navigation__language-selections navigation__language-selections--tablet" selector-hidden="true">
                    <button id="language-en" class="navigation__language-selection" language-active="true">EN</button>
                    <button id="language-fr" class="navigation__language-selection" language-active="false">FR</button>
                </div>
            </header>

            <!-- Navigation bar - mobile -->
            <header id="navigation-mobile" class="navigation navigation--mobile shadow">
                <nav class="navigation__content--mobile">
                    <div class="navigation__controllers">
                        <a href="#" class="navigation__hero--tablet navigation__link--tablet wf-icon-william_logo"></a>
                        <button id="mobile-burger" class="navigation__menu wf-icon-burger" data-extended="false"></button>
                    </div>
                    <div class="navigation__container">
                        <ul class="navigation__sections navigation__sections--mobile">
                            <li class="navigation__section navigation__section--mobile">
                                <a href="#about-me" class="navigation__link--mobile">About me</a>
                            </li>
                            <li class="navigation__section navigation__section--mobile">
                                <a href="#projects" class="navigation__link--mobile">My projects</a>
                            </li>
                            <li class="navigation__section navigation__section--mobile">
                                <a href="#experiences" class="navigation__link--mobile">Experiences</a>
                            </li>
                            <li class="navigation__section navigation__section--mobile">
                                <a href="#contact" class="navigation__link--mobile">Contact me</a>
                            </li>
                        </ul>
                        <div class="navigation__container-footer">
                            <button id="language-toggle-mobile" class="navigation__language navigation__language--mobile navigation__language-open wf-icon-globe"></button>
                            <div class="navigation__language-selections navigation__language-selections--mobile" selector-hidden="true">
                                <button id="language-en" class="navigation__language-selection" language-active="true">EN</button>
                                <button id="language-fr" class="navigation__language-selection" language-active="false">FR</button>
                            </div>
                        </div>
                    </div>
                </nav>
            </header>

            <!-- Hero section -->
            <section id="home" class="hero">
                <center class="hero__header">
                    <p class="hero__intro">Hi, I'm William Pasquier and I'm a</p>
                    <h1 class="hero__title bold">Software Developer</h1>
                </center>
                <div id="project-hero" class="hero__container">
                    <div id="hero-finder" class="finder shadow">
                        <aside class="finder__nav">
                            <div class="finder__nav-header">
                                <div class="finder__nav-btn finder__nav-close"></div>
                                <div class="finder__nav-btn finder__nav-reduce"></div>
                                <div class="finder__nav-btn finder__nav-resize"></div>
                            </div>
                            <h3 class="finder__nav-title">Projects</h3>
                            <nav id="hero-nav" class="finder__nav-content">
                                <ol class="skeleton__nav-projects">
                                    <li class="skeleton__nav-project skeleton__animation skeleton__animation--darker"></li>
                                    <li class="skeleton__nav-project skeleton__animation skeleton__animation--darker"></li>
                                    <li class="skeleton__nav-project skeleton__animation skeleton__animation--darker"></li>
                                    <li class="skeleton__nav-project skeleton__animation skeleton__animation--darker"></li>
                                    <li class="skeleton__nav-project skeleton__animation skeleton__animation--darker"></li>
                                </ol>
                                <!-- Navigation buttons -->
                            </nav>
                        </aside>
                        <div class="finder__container">
                            <div class="finder__container-header">
                                <div class="finder__header-info">
                                    <div class="finder__header-btns">
                                        <i class="finder__select-btn wf-icon-previous_arrow"></i>
                                        <i class="finder__select-btn wf-icon-next_arrow"></i>
                                    </div>
                                    <h2 class="finder__header-title">My projects</h2>
                                </div>
                                <div class="finder__content-btns">
                                    <i class="finder__content-btn wf-icon-window_layout"></i>
                                    <i class="finder__content-btn wf-icon-double_arrow"></i>
                                    <i class="finder__content-btn wf-icon-magnifying_glass"></i>
                                </div>
                            </div>
                            <div class="finder__container-content">
                                <div class="skeleton__thumbnail skeleton__animation"></div>
                                <!-- Images container -->
                            </div>
                            <div class="finder__container-footer">
                                <!-- Footer -->
                            </div>
                        </div>
                    </div>
                </div>
            </section>

            <!-- Navigation bar - desktop -->
            <header id="navigation-desktop" class="navigation navigation--desktop shadow--sm">
                <nav class="navigation__content">
                    <a href="#" class="navigation__hero navigation__link wf-icon-william_logo"></a>
                    <ul class="navigation__sections">
                        <li class="navigation__section navigation__section--desktop">
                            <a href="#about-me" class="navigation__link">About me</a>
                        </li>
                        <li class="navigation__section navigation__section--desktop">
                            <a href="#projects" class="navigation__link">My projects</a>
                        </li>
                        <li class="navigation__section navigation__section--desktop">
                            <a href="#experiences" class="navigation__link">Experiences</a>
                        </li>
                        <li class="navigation__section navigation__section--desktop">
                            <a href="#contact" class=".navigation__contact navigation__link">Contact me</a>
                        </li>
                    </ul>
                    <button id="language-toggle" class="navigation__language navigation__language-open wf-icon-globe"></button>
                    <a href="#about-me" class="navigation__link navigation__visit">
                        <span class="navigation__visit-text">Let's visit</span>
                        <i class="navigation__visit-arrow wf-icon-right_arrow"></i>
                    </a>
                </nav>
                <div class="navigation__language-selections" selector-hidden="true">
                    <button id="language-en" class="navigation__language-selection navigation__language-selection--desktop" language-active="true">EN</button>
                    <button id="language-fr" class="navigation__language-selection navigation__language-selection--desktop" language-active="false">FR</button>
                </div>
            </header>
        </main>
    </body>
</html>
